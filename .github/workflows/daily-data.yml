name: CBB daily data
# Every afternoon (Nov-Apr), rebuild the model's data files and commit them to this repo: the Excel workbook's files
# (games, teams, model, meta, lines), the paper-trading log, Haslametrics snapshots, and the new-line checker's
# model numbers (steam/model.json). Runs here, not in a Claude task, because GitHub Actions can commit to this repo
# on its own (a scheduled Claude run can't). It also builds the board's files (meta, teams, slates, ESPN lines, players,
# props) and publishes them to branch board-data; the Claude daily refresh only grades the ledger and writes the board.
# 19:20 UTC = 2:20 PM Eastern (standard time), plus evening score runs; a few minutes late is normal for scheduled jobs.
on:
  schedule:
    - cron: "20 19 * 11,12,1,2,3,4 *"
    - cron: "40 2,4,6 * 11,12,1,2,3,4 *"   # 9:40 PM, 11:40 PM, 1:40 AM ET: late finals, so the board's Results button has fresh scores
  workflow_dispatch:
  push:                      # also when the pipeline itself changes, so a fix takes effect the same day
    branches: [main]
    paths: ["pipeline/**", ".github/workflows/daily-data.yml"]

concurrency:
  group: daily-data
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Python packages
        run: pip install -q pandas numpy scipy pyarrow
      - name: Download hoopR data (sportsdataverse/hoopR-mbb-data, seasons 2021+)
        run: |
          GIT_LFS_SKIP_SMUDGE=1 git clone -q --depth 1 --filter=blob:none --no-checkout https://github.com/sportsdataverse/hoopR-mbb-data "$RUNNER_TEMP/hoopr"
          cd "$RUNNER_TEMP/hoopr"
          P=$(git ls-tree -r --name-only HEAD | grep -E '^mbb/(team_box|schedules|player_box|rosters)/parquet/(team_box|mbb_schedule|player_box|rosters)_20(2[1-9]|[3-9][0-9])\.parquet$')
          git checkout -q HEAD -- $P
      - name: Build
        id: build
        run: |
          set -e
          H="$RUNNER_TEMP/hoopr/mbb"; D="$RUNNER_TEMP/dash"; LG="$RUNNER_TEMP/log"; mkdir -p "$D" "$LG"
          G0=$(wc -l < games.csv); L0=$(wc -l < lines.csv); T0=$(python3 -c "import json;print(json.load(open('meta.json')).get('data_through',''))")
          python3 pipeline/espn_schedule.py "$H" 14 28 2>"$LG/espn_schedule.txt" || { cat "$LG/espn_schedule.txt" >&2; exit 1; }; cat "$LG/espn_schedule.txt" >&2
          python3 pipeline/lines.py "$H" . || git checkout -- lines.csv
          python3 pipeline/bpi.py "$H" . || true
          python3 pipeline/hasla.py . || true
          python3 pipeline/process.py "$H" .
          python3 pipeline/check.py . "$G0" "$L0" "$T0"
          python3 pipeline/dashboard.py "$H" . "$D"
          python3 pipeline/upcoming.py "$H" "$D/board_espn.json" || echo "upcoming.py failed - paper trading skipped"
          if [ -f "$D/board_espn.json" ]; then python3 pipeline/paper.py "$H" . "$D" || git checkout -- paper.csv 2>/dev/null || true; fi
          python3 pipeline/export_model.py "$D" steam/teammap.json . 3
          cp pipeline/boardmath.py steam/boardmath.py
          # the board's own files, so the Claude daily task only has to write them (published to branch board-data below)
          python3 pipeline/players.py "$H" . "$D/board_players.json" 2>"$LG/players.txt" || rm -f "$D/board_players.json"; cat "$LG/players.txt" >&2
          python3 pipeline/props_proj.py "$H" "$D/board_props.json" 2>"$LG/props_proj.txt" || rm -f "$D/board_props.json"; cat "$LG/props_proj.txt" >&2
          python3 pipeline/grade_inputs.py "$H" "$D/mbb"
          python3 pipeline/board_summary.py . "$D" "$LG" "$L0"
      - name: Commit
        if: success()
        run: |
          git config user.name "cbb-data-bot"; git config user.email "actions@users.noreply.github.com"
          git add games.csv teams.csv model.csv meta.json lines.csv steam/model.json steam/boardmath.py
          git add paper.csv hasla/*.csv bpi_preseason_*.csv 2>/dev/null || true
          git diff --cached --quiet && { echo "nothing to commit"; exit 0; }
          git commit -q -m "Data through $(python3 -c "import json;print(json.load(open('meta.json'))['data_through'])")"
          for i in 1 2 3; do git pull --rebase -q origin main && git push -q origin HEAD:main && break; sleep 10; done
      - name: Publish board data (branch board-data, replaced each run)
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd "$RUNNER_TEMP/dash"
          git init -q -b board-data
          git config user.name "cbb-data-bot"; git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -q -m "Board data $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push -f -q "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" board-data
      - name: Build the board writes (branch daily-out, replaced each run)
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # grade the ledger and props here, so the Claude daily task only copies files (it can't run repo code)
          DB="$RUNNER_TEMP/ddb"; OUT="$RUNNER_TEMP/dout"; PUB="$RUNNER_TEMP/dpub"; mkdir -p "$DB/rec" "$DB/prop" "$PUB"
          if git fetch -q --depth 1 origin +refs/heads/odds-raw:refs/remotes/origin/odds-raw; then
            mkdir -p "$RUNNER_TEMP/oraw" && git archive refs/remotes/origin/odds-raw state | tar -x -C "$RUNNER_TEMP/oraw" || true
            cp "$RUNNER_TEMP"/oraw/state/rec/*.json "$DB/rec/" 2>/dev/null || true
            cp "$RUNNER_TEMP"/oraw/state/prop/*.json "$DB/prop/" 2>/dev/null || true
          fi
          python3 pipeline/daily_write.py "$RUNNER_TEMP/dash" . "$DB" "$OUT"
          python3 pipeline/publish_batches.py "$OUT" "$PUB"
          cd "$PUB"
          git init -q -b daily-out
          git config user.name "cbb-data-bot"; git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -q -m "Daily board writes $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push -f -q "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" daily-out
