name: Availability probe (one-off)
# Finds each conference's availability-report page and the widget/data URLs it loads; saves to branch avail-probe.
on:
  push:
    branches: [main]
    paths: ["probe/**", ".github/workflows/avail-probe.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - run: python3 probe/avail_probe.py
      - name: Save to branch avail-probe
        run: |
          cd probe_out
          git init -q -b avail-probe && git add -A
          git -c user.name=probe -c user.email=probe@users.noreply.github.com commit -qm "availability probe $(date -u +%FT%TZ)"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" avail-probe
