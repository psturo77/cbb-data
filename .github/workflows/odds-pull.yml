name: CBB odds pull
# Since Nov 21 2026: one run loops pipeline/odds_cycle.sh every 2 min from 3:30-7:30 PM ET (when books post openers) and every
# 3 min otherwise (10 min if credits run short before the monthly reset), 7 AM-midnight ET, for about 50 min; the cron below starts a new run every 15 min, so one is always queued
# (GitHub drops or delays many scheduled starts), and each scheduled-mode run queues the next one itself when it ends. Each cycle asks for your books + Pinnacle only: 1 credit (was 3). Each cycle runs
# pipeline/odds_run.py here in GitHub to build the
# board's odds, ESPN lines, injuries, alerts, ledger recs (and the 1 PM props snapshot). Everything lands on the odds-raw
# branch: out/batch*.json are ready-made board writes, and state/ carries the alert history and the recs already made.
# The Claude odds task runs 5 minutes later and only copies out/batch*.json onto the board - it runs no code and holds no key.
# Times are UTC: :05 and :35 past each hour 14-23 and 0-4 = 9:05 AM to 11:35 PM Eastern (GitHub starts these 25-50 min late, and sometimes skips one) (standard time; an hour later in ET once DST starts in March).
# The Claude odds task starts at :50 each hour, waits up to 16 min for a build it hasn't copied (build id in out/alerted.json), and sends every alert in
# out/alert_log.json from builds newer than the one it last copied - so alerts from a build it never copied are still sent.
on:
  schedule:
    - cron: "*/15 0-5,11-23 * 11,12,1,2,3,4 *"
  workflow_dispatch:
    inputs:
      mode:
        description: "scheduled, manual (the board's Full refresh) or quick (odds only)"
        type: choice
        options: [manual, quick, scheduled]
        default: manual
      props:
        description: "Also snapshot player props"
        type: boolean
        default: false
      ntfy_test:
        description: "Send a test notification to the ntfy topic"
        type: boolean
        default: false

concurrency:
  group: odds-pull
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  pull:
    runs-on: ubuntu-latest
    timeout-minutes: 62
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: pipeline
      - name: Odds cycles
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_TEST: ${{ inputs.ntfy_test == true && '1' || '0' }}
          PROPS_FORCE: ${{ inputs.props == true && '1' || '0' }}
          MODE: ${{ inputs.mode || 'scheduled' }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          pip install -q pandas
          start=$(date +%s); i=0
          while :; do
            hm=$(( 10#$(TZ=America/New_York date +%H) * 60 + 10#$(TZ=America/New_York date +%M) ))
            if [ "$MODE" = "scheduled" ] && [ $hm -lt 420 ]; then echo "outside 7 AM-midnight ET - done"; break; fi
            i=$((i + 1)); c0=$(date +%s)
            echo "::group::cycle $i ($(TZ=America/New_York date +%H:%M) ET)"
            BUILD="${{ github.run_id }}$(printf %02d $i)" bash pipeline/odds_cycle.sh || echo "cycle $i failed"
            echo "::endgroup::"
            [ "$MODE" != "scheduled" ] && break
            # every 2 min 3:30-7:30 PM ET (openers), every 3 min otherwise (~400 credits a day of the 20,000-a-month plan).
            # Credit guard: if fewer than 300 credits per day are left before the 1st of next month, slow to every 10 min.
            if [ $hm -ge 930 ] && [ $hm -lt 1170 ]; then gap=120; else gap=180; fi
            left=$(python3 -c "import json;print(int(json.load(open('/tmp/raw/pull.json')).get('credits') or 0))" 2>/dev/null || echo 0)
            days=$(python3 -c "import datetime as d;t=d.date.today();n=(t.replace(day=28)+d.timedelta(days=4)).replace(day=1);print((n-t).days)")
            if [ "$left" -lt $(( 300 * days )) ]; then echo "credit guard: $left left, $days days to reset - every 10 min"; gap=600; fi
            now=$(date +%s); [ $(( now - start + gap )) -gt 3000 ] && { echo "run time used - next run takes over"; break; }
            wait=$(( gap - (now - c0) )); [ $wait -lt 30 ] && wait=30
            sleep $wait
          done
          # chain: a scheduled-mode run starts the next one itself (GitHub's cron often starts runs 40+ min late or not at all);
          # it queues behind this run in the odds-pull concurrency group. Stops for the night; the 7 AM cron restarts the chain.
          hm=$(( 10#$(TZ=America/New_York date +%H) * 60 + 10#$(TZ=America/New_York date +%M) ))
          if [ "$MODE" = "scheduled" ] && [ $hm -ge 420 ] && [ $hm -lt 1430 ]; then
            gh api -X POST "repos/$REPO/actions/workflows/odds-pull.yml/dispatches" -f ref=main -f "inputs[mode]=scheduled" && echo "next run queued" || echo "could not queue the next run"
          fi
