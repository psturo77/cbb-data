name: CBB odds pull
# Every 30 minutes, 9 AM-11:30 PM ET (spreads only, 3 credits a pull): pull The Odds API (every book + Pinnacle), then run pipeline/odds_run.py here in GitHub to build the
# board's odds, ESPN lines, injuries, alerts, ledger recs (and the 1 PM props snapshot). Everything lands on the odds-raw
# branch: out/batch*.json are ready-made board writes, and state/ carries the alert history and the recs already made.
# The Claude odds task runs 5 minutes later and only copies out/batch*.json onto the board - it runs no code and holds no key.
# Times are UTC: :05 and :35 past each hour 14-23 and 0-4 = 9:05 AM to 11:35 PM Eastern (GitHub starts these 25-50 min late, and sometimes skips one) (standard time; an hour later in ET once DST starts in March).
# The Claude odds task starts at :50 each hour, waits up to 16 min for a build it hasn't copied (build id in out/alerted.json), and sends every alert in
# out/alert_log.json from builds newer than the one it last copied - so alerts from a build it never copied are still sent.
on:
  schedule:
    - cron: "5,35 0-4,14-23 * 11,12,1,2,3,4 *"
  workflow_dispatch:
    inputs:
      mode:
        description: "scheduled, manual (the board's Full refresh) or quick (odds only)"
        type: choice
        options: [manual, quick, scheduled]
        default: manual
      props:
        description: "Also snapshot player props"
        type: boolean
        default: false
      ntfy_test:
        description: "Send a test notification to the ntfy topic"
        type: boolean
        default: false

concurrency:
  group: odds-pull
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  pull:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: pipeline
      - name: Pull odds
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          mkdir -p /tmp/raw/prop
          python3 - <<'PY'
          import os, json, urllib.request, urllib.error, datetime
          key = os.environ["ODDS_API_KEY"]
          url = ("https://api.the-odds-api.com/v4/sports/basketball_ncaab/odds?regions=us,us2,eu&markets=spreads"
                 f"&oddsFormat=american&apiKey={key}")
          meta = {"pulled_at": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ")}
          try:
              with urllib.request.urlopen(urllib.request.Request(url, headers={"User-Agent": "CBB-model"}), timeout=60) as r:
                  open("/tmp/raw/raw.json", "wb").write(r.read()); meta["credits"] = r.headers.get("x-requests-remaining", "?")
          except urllib.error.HTTPError as e:
              meta["error"] = f"HTTP {e.code} " + e.read()[:120].decode("utf-8", "replace").replace(key, "<key>")
          except Exception as e:
              meta["error"] = (str(e) or type(e).__name__).replace(key, "<key>")[:160]
          json.dump(meta, open("/tmp/raw/pull.json", "w"))
          print(json.dumps(meta))
          PY
      - name: Gather board inputs
        run: |
          pip install -q pandas
          mkdir -p /tmp/bd /tmp/prev /tmp/db/board /tmp/db/slate /tmp/db/rec /tmp/db/prop
          git fetch -q --depth 1 origin +refs/heads/board-data:refs/remotes/origin/board-data
          git archive refs/remotes/origin/board-data | tar -x -C /tmp/bd
          if git fetch -q --depth 1 origin +refs/heads/odds-raw:refs/remotes/origin/odds-raw; then git archive refs/remotes/origin/odds-raw | tar -x -C /tmp/prev; fi
          for n in meta players espn props teams; do [ -f /tmp/bd/board_$n.json ] && cp /tmp/bd/board_$n.json /tmp/db/board/$n.json; done
          cp pipeline/teammap.json /tmp/db/board/teammap.json
          for f in /tmp/bd/slate_d*.json; do cp "$f" "/tmp/db/slate/$(basename "$f" | sed 's/^slate_//')"; done
          mkdir -p /tmp/prev/state/rec /tmp/prev/state/prop
          for n in alerts injuries odds prefs; do [ -f /tmp/prev/state/$n.json ] && cp /tmp/prev/state/$n.json /tmp/db/board/$n.json; done
          cp /tmp/prev/state/rec/*.json /tmp/db/rec/ 2>/dev/null || true
          cp /tmp/prev/state/prop/*.json /tmp/db/prop/ 2>/dev/null || true
          echo "slates: $(ls /tmp/db/slate | wc -l), recs known: $(ls /tmp/db/rec | wc -l)"
      - name: Props snapshot (1 PM run)
        if: github.event_name == 'schedule' || inputs.props == true
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          FORCE: ${{ inputs.props == true && '1' || '0' }}
        run: |
          if [ "$FORCE" != "1" ] && [ "$(TZ=America/New_York date +%H)" != "13" ]; then echo "not the 1 PM run"; exit 0; fi
          if [ "$FORCE" != "1" ] && [ "$(cat /tmp/prev/state/props_day.txt 2>/dev/null)" = "$(TZ=America/New_York date +%F)" ]; then echo "props already snapped today"; exit 0; fi
          TZ=America/New_York date +%F > /tmp/props_day.txt
          [ -f /tmp/db/board/props.json ] || { echo "no props projections"; exit 0; }
          python3 pipeline/props_snap.py /tmp/db/board/props.json /tmp/db/board/teammap.json /tmp/db/prop /tmp/raw/prop 60 || echo "props snapshot failed"
      - name: Build the board writes
        env:
          MODE: ${{ inputs.mode || 'scheduled' }}
        run: |
          flag=""; [ "$MODE" = "manual" ] && flag="--manual"; [ "$MODE" = "quick" ] && flag="--light"
          today=$(TZ=America/New_York date +%F)
          # one morning summary a day (two runs can land in the 9 AM hour)
          if [ "$(cat /tmp/prev/state/digest_day.txt 2>/dev/null)" = "$today" ]; then flag="$flag --no-digest"; fi
          python3 pipeline/odds_run.py /tmp/db /tmp/out --raw-dir=/tmp/raw $flag || echo "odds_run failed" > /tmp/out_failed
          mkdir -p /tmp/raw/out /tmp/raw/state/rec /tmp/raw/state/prop
          cp -r /tmp/out/. /tmp/raw/out/ 2>/dev/null || true
          rm -f /tmp/raw/out/raw.json
          python3 - <<'PY'
          import glob, json, os
          for f in glob.glob("/tmp/raw/out/batch*.json"):
              d = json.load(open(f))
              for w in d["writes"]:
                  if "file_path" in w: w["file_path"] = w["file_path"].replace("/tmp/out/", "out/")
              json.dump(d, open(f, "w"), indent=1)
          PY
          # carry the state forward: alert history, injuries, and every rec / prop made so far
          cp /tmp/prev/state/rec/*.json /tmp/raw/state/rec/ 2>/dev/null || true
          cp /tmp/prev/state/prop/*.json /tmp/raw/state/prop/ 2>/dev/null || true
          cp /tmp/out/rec/*.json /tmp/raw/state/rec/ 2>/dev/null || true
          cp /tmp/out/prop/*.json /tmp/raw/state/prop/ 2>/dev/null || true
          if [ -f /tmp/out/alerted.json ]; then cp /tmp/out/alerted.json /tmp/raw/state/alerts.json; elif [ -f /tmp/prev/state/alerts.json ]; then cp /tmp/prev/state/alerts.json /tmp/raw/state/; fi
          if [ -f /tmp/out/board_injuries.json ]; then cp /tmp/out/board_injuries.json /tmp/raw/state/injuries.json; elif [ -f /tmp/prev/state/injuries.json ]; then cp /tmp/prev/state/injuries.json /tmp/raw/state/; fi
          if [ -f /tmp/out/board_odds.json ]; then cp /tmp/out/board_odds.json /tmp/raw/state/odds.json; elif [ -f /tmp/prev/state/odds.json ]; then cp /tmp/prev/state/odds.json /tmp/raw/state/; fi
          [ -f /tmp/prev/state/prefs.json ] && cp /tmp/prev/state/prefs.json /tmp/raw/state/ || true
          # once-a-day stamps
          if [ "$MODE" = "scheduled" ] && [ "$(TZ=America/New_York date +%H)" = "09" ]; then echo "$today" > /tmp/raw/state/digest_day.txt; else cp /tmp/prev/state/digest_day.txt /tmp/raw/state/ 2>/dev/null || true; fi
          if [ -f /tmp/props_day.txt ]; then cp /tmp/props_day.txt /tmp/raw/state/props_day.txt; else cp /tmp/prev/state/props_day.txt /tmp/raw/state/ 2>/dev/null || true; fi
          # alert log: every build's new alerts (last 48 builds), so the copy task can send alerts from builds it never copied
          python3 - "${{ github.run_id }}" <<'PY'
          import json, os, sys, datetime
          prev = "/tmp/prev/state/alert_log.json"
          log = json.load(open(prev)) if os.path.exists(prev) else []
          lines = [l.rstrip("\n") for l in open("/tmp/out/alerts.txt")] if os.path.exists("/tmp/out/alerts.txt") else []
          log.append({"run": sys.argv[1], "built_at": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"), "alerts": [l for l in lines if l.strip()]})
          log = log[-48:]
          for f in ("/tmp/raw/state/alert_log.json", "/tmp/raw/out/alert_log.json"): json.dump(log, open(f, "w"), indent=1)
          PY
          echo "{\"mode\":\"$MODE\", \"built_at\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\", \"run\": \"${{ github.run_id }}\"}" > /tmp/raw/out/run.json
          # stamp the build id into the board's alerts doc, so the copy task can tell a build it already copied (and never re-sends its alerts)
          [ -f /tmp/raw/out/alerted.json ] && python3 -c "import json,sys; f=sys.argv[1]; d=json.load(open(f)); d['build']=sys.argv[2]; json.dump(d, open(f,'w'))" /tmp/raw/out/alerted.json "${{ github.run_id }}" || true
          cat /tmp/raw/out/reply.txt 2>/dev/null || cat /tmp/out_failed
      - name: Send new bets to ntfy
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_TEST: ${{ inputs.ntfy_test == true && '1' || '0' }}
        run: |
          python3 - <<'PY'
          import os, urllib.request
          topic = os.environ.get("NTFY_TOPIC", "").strip()
          if not topic: print("no NTFY_TOPIC secret - skipped"); raise SystemExit(0)
          lines = [l.strip() for l in open("/tmp/out/alerts.txt")] if os.path.exists("/tmp/out/alerts.txt") else []
          lines = [l for l in lines if l]
          if os.environ.get("NTFY_TEST") == "1" and not lines:
              lines = ["Test: CBB spread alerts are connected. New 5%+ spread bets will arrive here."]
          if not lines: print("no new bets"); raise SystemExit(0)
          title = f"{len(lines)} new spread bet{'s' if len(lines) > 1 else ''} over 5%" if not lines[0].startswith("Test:") else "CBB alerts test"
          req = urllib.request.Request(f"https://ntfy.sh/{topic}", data="\n\n".join(lines[:8]).encode(), method="POST",
                                       headers={"Title": title, "Priority": "high", "Tags": "basketball",
                                                "Click": "https://claude.ai/artifact/SgPtmedZ2wVPiYHaJoRNZh"})
          try: urllib.request.urlopen(req, timeout=20).read(); print(f"sent {len(lines)} line(s)")
          except Exception as e: print("ntfy send failed:", type(e).__name__)
          PY
      - name: Publish to the odds-raw branch
        run: |
          cd /tmp/raw
          git init -q -b odds-raw
          git config user.name "cbb-odds-bot"; git config user.email "actions@users.noreply.github.com"
          git add -A && git commit -q -m "Odds run $(cat pull.json | head -c 60)"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" odds-raw
